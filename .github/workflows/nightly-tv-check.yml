name: TV Italia + Puglia - verifica notturna delle dirette

on:
  schedule:
    # 02:17 UTC = 03:17 a Roma in inverno, 04:17 in estate.
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nightly_check.py'
      - 'scripts/test_nightly.py'
      - 'scripts/test_worker_v389.mjs'
      - 'cloudflare/worker-tv-v3.8.9.js'
      - 'cloudflare/worker-tv-v3.9.0.js'
      - 'scripts/test_worker_v390.mjs'
      - 'data/additional-channels.m3u'
      - '.github/workflows/nightly-tv-check.yml'

permissions:
  contents: write

concurrency:
  group: nightly-tv-check
  cancel-in-progress: false

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test automatici offline
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verifica Worker Cloudflare 3.8.9 e fallback Italia
        run: |
          node --check cloudflare/worker-tv-v3.8.9.js
          node scripts/test_worker_v389.mjs
          node --check cloudflare/worker-tv-v3.9.0.js
          node scripts/test_worker_v390.mjs
      - name: Test playlist e stream
        run: python scripts/nightly_check.py
      - name: Pubblica l'elenco aggiornato
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/verified-streams.json /tmp/verified-streams.json
          cp data/stream-report.md /tmp/stream-report.md
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            # A slower run must not replace the output of a later scan.
            if [ -f data/verified-streams.json ]; then
              if python -c "import json,sys; old=json.load(open('data/verified-streams.json')); new=json.load(open('/tmp/verified-streams.json')); sys.exit(0 if old.get('generated_at','') > new.get('generated_at','') else 1)"; then
                echo 'A newer verified snapshot already exists; keeping it.'
                exit 0
              fi
            fi
            cp /tmp/verified-streams.json data/verified-streams.json
            cp /tmp/stream-report.md data/stream-report.md
            git add data/verified-streams.json data/stream-report.md
            if git diff --cached --quiet; then
              echo 'No changes to publish.'
              exit 0
            fi
            git commit -m 'chore(tv): aggiorna fonti verificate'
            if git push origin HEAD:main; then
              echo 'Verified snapshot published.'
              exit 0
            fi
            sleep 2
          done
          echo 'Publishing failed after four attempts.'
          exit 1
