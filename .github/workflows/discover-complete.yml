name: TV Italia Complete - ricerca playlist
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'complete/discover_playlists.py'
      - '.github/workflows/discover-complete.yml'
      - 'complete/playlist-candidates.json'
permissions:
  contents: read
concurrency:
  group: tv-complete-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Search public project and directory metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile complete/discover_playlists.py
          python3 complete/discover_playlists.py
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-discovery-report
          path: complete/discovery-report.json
          retention-days: 14
