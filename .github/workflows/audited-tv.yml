name: TV Italia + Puglia - verifica visiva generale 5.0
on:
  workflow_run:
    workflows: ['TV Italia + Puglia - verifica notturna delle dirette']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audited_streams.py'
      - 'scripts/content_identity.py'
      - 'scripts/playback_quality.py'
      - 'pilot_tests/test_audited_streams.py'
      - 'cloudflare/worker-tv-v5.0.0.js'
      - 'cloudflare/worker-tv-v5.1.2.js'
      - 'scripts/test_worker_v512.mjs'
      - 'data/channel-watchlist.json'
      - 'data/source-identity-review.json'
      - 'data/source-quarantine.json'
      - '.github/workflows/audited-tv.yml'
permissions:
  contents: write
concurrency:
  group: audited-tv
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local vision dependencies
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'nudenet==3.4.2'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Offline tests
        run: |
          PYTHONPATH=scripts python -m unittest discover -s pilot_tests -p 'test_audited_streams.py' -v
          python -m unittest discover -s scripts -p 'test_playback_quality.py' -v
          node --check cloudflare/worker-tv-v5.0.0.js
          node --check cloudflare/worker-tv-v5.1.2.js
          node scripts/test_worker_v512.mjs
      - name: Verify reviewed live streams
        run: python scripts/audited_streams.py
      - name: Publish separate audited snapshot
        run: |
          set -euo pipefail
          cp data/audited-streams.json /tmp/audited-streams.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if [ -f data/audited-streams.json ] && python -c "import json,sys; a=json.load(open('data/audited-streams.json')); b=json.load(open('/tmp/audited-streams.json')); sys.exit(0 if a['generated_at'] > b['generated_at'] else 1)"; then
              exit 0
            fi
            cp /tmp/audited-streams.json data/audited-streams.json
            git add data/audited-streams.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore(tv): aggiorna indice con verifica visiva'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Verifica credenziali Cloudflare
        id: cloudflare_credentials
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Manca il secret CLOUDFLARE_API_TOKEN nelle impostazioni GitHub del repository."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Manca CLOUDFLARE_ACCOUNT_ID: aggiungilo come repository secret o variable."
            exit 1
          fi

      - name: Deploy Worker 5.1.2 in produzione
        id: cloudflare_deploy
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verifica manifest e catalogo in produzione
        id: production_verify
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          WORKER_URL: https://tv-italia-puglia.annalisazotti11.workers.dev
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-delay 5 --retry-connrefused "$WORKER_URL/manifest.json" -o manifest.json
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if(m.version!=='5.1.2'||m.id!=='community.tv-italia-puglia') throw new Error('Manifest produzione inatteso: '+JSON.stringify(m));"
          curl -fsS --retry 12 --retry-delay 5 --retry-connrefused "$WORKER_URL/debug/channels.json" -o debug.json
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('debug.json','utf8')); const expected=['Sky Cinema Due','Zona DAZN','DAZN Darts','Sky Sport Uno Ultra Live','Sky Sport Calcio Ultra Live','DAZN Serie A','DAZN Serie B']; if(d.version!=='5.1.2') throw new Error('Debug Worker non aggiornato'); if(d.officialWebOnly!==0||d.directVerified!==d.visible) throw new Error('Catalogo contiene collegamenti web'); for(const n of expected) if(!d.channels.some(c=>c.name===n&&c.discoveryOnly)) throw new Error('Canale monitorato mancante: '+n); console.log('Produzione verificata: Worker '+d.version+', '+d.visible+' canali visibili, '+d.watchlistCount+' monitorati, '+d.discoveryOnlyCount+' candidati discovery-only.');"

      - name: Registra esito audit e deployment
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          RUN_RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          CREDENTIALS_RESULT: ${{ steps.cloudflare_credentials.outcome }}
          DEPLOY_RESULT: ${{ steps.cloudflare_deploy.outcome }}
          VERIFY_RESULT: ${{ steps.production_verify.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const steps = {
            credentials: process.env.CREDENTIALS_RESULT || 'unknown',
            deployment: process.env.DEPLOY_RESULT || 'unknown',
            production_verification: process.env.VERIFY_RESULT || 'unknown'
          };
          const stage = steps.credentials === 'failure' ? 'cloudflare_credentials'
            : steps.deployment === 'failure' ? 'cloudflare_deployment'
            : steps.production_verification === 'failure' ? 'production_verification'
            : 'visual_audit_and_cloudflare_deployment';
          const data = {
            version: '5.1.2',
            status: process.env.RUN_RESULT || 'unknown',
            stage,
            steps,
            source_commit: process.env.SOURCE_SHA || null,
            worker_url: 'https://tv-italia-puglia.annalisazotti11.workers.dev',
            updated_at: new Date().toISOString()
          };
          fs.writeFileSync('data/deployment-status.json', JSON.stringify(data, null, 2) + '\n');
          NODE
          git add data/deployment-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(tv): registra esito release Worker 5.1.2'
          git push origin HEAD:main
