name: Worker 4.9.6 syntax check
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker-tv-v4.9.6.js'
      - '.github/workflows/worker-syntax-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check cloudflare/worker-tv-v4.9.6.js
      - name: Check direct Canale 5 stream is returned to Nuvio
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const s = fs.readFileSync('cloudflare/worker-tv-v4.9.6.js', 'utf8');
          const required = [
            "const VERSION = '4.9.6';",
            "https://n-5-1.eu.cdn-redge.media/livehls/oeu/mt/live/canale_5/live.livx/playlist.m3u8",
            "if (id === C5_ID) return streams(null, id);",
            "snapshot().catch(() => null)",
            "url: C5_DIRECT_SOURCE.url",
            "sourceCount: 1"
          ];
          for (const item of required) {
            if (!s.includes(item)) throw new Error('Missing required code: ' + item);
          }
          const start = s.indexOf('if (id === C5_ID) {', s.indexOf('async function streams'));
          const end = s.indexOf('const candidates', start);
          const branch = s.slice(start, end);
          if (branch.includes('externalUrl') || branch.includes('notWebReady')) {
            throw new Error('Canale 5 must expose one native HLS stream without external fallbacks or notWebReady.');
          }
          if (s.includes('fetch(C5_DIRECT_SOURCE.url')) {
            throw new Error('The Worker must return the upstream URL directly, not proxy media.');
          }
          console.log('Worker 4.9.6 syntax and Nuvio direct-stream wiring OK.');
          JS
