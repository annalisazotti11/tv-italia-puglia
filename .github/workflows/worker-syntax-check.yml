name: Worker 4.9.4 baseline syntax check
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker-tv-v4.9.4.js'
      - '.github/workflows/worker-syntax-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check cloudflare/worker-tv-v4.9.4.js
      - name: Check Canale 5 uses the official fallback
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const s = fs.readFileSync('cloudflare/worker-tv-v4.9.4.js', 'utf8');
          const required = [
            "const VERSION = '4.9.4';",
            "https://mediasetinfinity.mediaset.it/diretta/canale5_cC5",
            "name: 'Mediaset Infinity · ufficiale'",
            "externalUrl: C5_OFFICIAL_PAGE"
          ];
          for (const item of required) {
            if (!s.includes(item)) throw new Error('Missing required code: ' + item);
          }
          if (s.includes('n-5-1.eu.cdn-redge.media/livehls/oeu/mt/live/canale_5/')) {
            throw new Error('Unverified Redge Canale 5 override must not be deployed.');
          }
          console.log('Worker 4.9.4 syntax and official Canale 5 fallback OK.');
          JS
